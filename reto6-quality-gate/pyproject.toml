[project]
name = "quality-gate-reto"
version = "0.1.0"
description = "Reto práctico Certificación 6: quality gate con métricas de gobernanza y ML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
