[pytest]
# Directorio donde viven los step definitions de pytest-bdd
testpaths = steps
# Directorio donde pytest-bdd busca los archivos .feature (Gherkin)
bdd_features_base_dir = features
# Marcadores registrados (evita warnings de PytestUnknownMarkWarning)
markers =
    catalogo: casos de la suite Catalogo (Azure Test Plans)
    carrito: casos de la suite Carrito (Azure Test Plans)
    pedidos: casos de la suite Pedidos (Azure Test Plans)
    smoke: subconjunto critico de humo
    borde: casos de borde generados con IA Generativa + MCP Playwright
    ia: escenarios disenados/mantenidos con asistencia de IA (Claude + MCP)
    TC19: Azure Test Case 19 - Agregar un producto al carrito incrementa el contador
    TC20: Azure Test Case 20 - Filtrar productos por categoria Hogar
    TC21: Azure Test Case 21 - Confirmar un pedido con un producto
    TC22: Azure Test Case 22 - Busqueda sin coincidencias muestra mensaje vacio (IA)
    TC23: Azure Test Case 23 - Acumulacion de cantidad al agregar el mismo producto dos veces (IA)
    TC24: Azure Test Case 24 - Abrir carrito sin productos muestra estado vacio (IA)
addopts = -v --tb=short
